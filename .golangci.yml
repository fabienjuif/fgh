version: "2"

linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - bodyclose
    - errorlint
    - gocritic
    - misspell
    - nilerr
    - revive
    - sloglint
    - testifylint
    - unconvert
    - unparam
    - usestdlibvars
    - whitespace
  settings:
    sloglint:
      no-mixed-args: true
      key-naming-case: snake # the "err" key for errors
    revive:
      rules:
        - name: unused-parameter
          disabled: true # cobra RunE and handler signatures often ignore params
    gocritic:
      disabled-checks:
        - ifElseChain
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - unparam
          - errcheck

formatters:
  enable:
    - gofumpt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/fabienjuif/fgh
